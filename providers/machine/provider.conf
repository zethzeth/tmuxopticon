# Machine — local CPU / memory / GPU / thermal health for THIS box, so the
# sidebar can answer "why does this thing feel slow right now?". Unlike the
# other bundled providers this one touches no network and needs no secret —
# it reads /proc, /sys and ps. See pull.sh and this dir's README.md (legend).
id=machine
title=Machine
flag=MACHINE_PULL_ENABLED
pull=pull.sh
order=15
timeout=20
throttle_min=0
# 0 = no cap. This box is a small table (metric rows, a spacer, then the
# greediest apps), not a headline plus a few notes, and truncating a table is
# always wrong: the rows that get hidden are the per-application ones at the
# bottom — exactly the "who is doing this to me" half of the diagnosis. A
# "+5 more" you cannot expand is strictly worse than the data. The output is
# self-limiting anyway (rows are omitted when their numbers are unavailable, and
# swap/disk only appear once they matter), so uncapping cannot run away.
max_lines=0
