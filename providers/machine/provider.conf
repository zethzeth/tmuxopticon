# Machine — local CPU / memory / GPU / thermal health for THIS box, so the
# sidebar can answer "why does this thing feel slow right now?". Unlike the
# other bundled providers this one touches no network and needs no secret —
# it reads /proc, /sys and ps. See pull.sh and this dir's README.md (legend).
id=machine
title=Machine
flag=MACHINE_PULL_ENABLED
pull=pull.sh
order=15
timeout=20
throttle_min=0
# This box is a small table (metric rows, a spacer, then the greediest apps),
# not a headline plus a few notes, so it needs more than the default 6 detail
# lines. Worst case is every optional row plus three apps.
max_lines=14
